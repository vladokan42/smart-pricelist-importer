<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Smart Pricelist Importer</title>
  <desc id="desc">Умный импорт Excel-прайсов: модель предлагает ОКПД2 с проверкой по справочнику и извлекает ставку НДС из исходника. Неизвестное остаётся неизвестным.</desc>
  <rect width="1200" height="400" rx="18" fill="#0a0a0b"/>
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="56" y="61" fill="#a1a1aa" font-size="19" letter-spacing="2">EXCEL / AI / ДАННЫЕ С ПОДТВЕРЖДЕНИЕМ</text>
    <text x="52" y="153" fill="#fafafa" font-size="74" font-weight="650" letter-spacing="-3">Smart Pricelist</text>
    <text x="52" y="238" fill="#fafafa" font-size="74" font-weight="650" letter-spacing="-3">Importer<tspan fill="#f97316">.</tspan></text>
  </g>
  <g id="data-boundaries" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <line x1="792" y1="98" x2="1144" y2="98" stroke="#3f3f46"/>
    <text x="792" y="135" fill="#fafafa" font-size="29" font-weight="600">ОКПД2</text>
    <text x="792" y="168" fill="#a1a1aa" font-size="22">Проверка по справочнику</text>
    <line x1="792" y1="192" x2="1144" y2="192" stroke="#3f3f46"/>
    <text x="792" y="231" fill="#fafafa" font-size="29" font-weight="600">НДС</text>
    <text x="792" y="264" fill="#a1a1aa" font-size="22">Только из исходника</text>
  </g>
  <line x1="56" y1="313" x2="1144" y2="313" stroke="#3f3f46"/>
  <g id="repository-context" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">
    <text x="56" y="359" fill="#a1a1aa">Python · OpenAI-compatible · XLSX / XLS</text>
    <text x="1144" y="359" text-anchor="end" fill="#fafafa">Неизвестное ≠ выдуманное</text>
  </g>
</svg>
